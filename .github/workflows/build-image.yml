name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - rocm-port
      - feature/open3d-pointcloud-preprocess
  pull_request:
    branches:
      - main
      - rocm-port
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bjoernellens1/3dgs-mcmc

jobs:
  build-and-push:
    # Standard runner is fine once we strip the pre-installed bloat
    # (Android SDK, .NET, etc. — ~30 GB of stuff we don't need).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Remove pre-installed tooling the build doesn't need
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo docker image prune -af
          sudo apt-get clean
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=rocm-port,enable=${{ github.ref == 'refs/heads/rocm-port' }}
            type=raw,value=edge,enable=${{ startsWith(github.ref, 'refs/heads/feature/') }}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Pull image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Test core imports
        run: |
          docker run --rm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            python3 -c "
          import torch
          import gsplat
          import numpy
          import cv2
          import plyfile
          import tqdm
          import rich
          from jaxtyping import Float
          from torch.utils.tensorboard import SummaryWriter
          print('All imports OK')
          print('PyTorch:', torch.__version__)
          print('gsplat:', gsplat.__version__)
          "
