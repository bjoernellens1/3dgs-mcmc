<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3DGS-MCMC Live Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #0f172a; color: #e2e8f0; padding: 16px; }
  h1 { font-size: 1.2rem; margin-bottom: 12px; color: #38bdf8; }
  .status { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; font-size: 0.85rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .dot.off { background: #ef4444; }
  .top-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .canvas-wrap { flex: 1 1 480px; min-width: 320px; background: #1e293b; border-radius: 8px;
                 padding: 8px; display: flex; flex-direction: column; }
  .canvas-wrap canvas { width: 100%; aspect-ratio: 4/3; object-fit: contain;
                        background: #000; border-radius: 4px; image-rendering: auto; }
  .canvas-label { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; flex: 0 0 auto; align-content: flex-start; }
  .stat-card { background: #1e293b; border-radius: 8px; padding: 10px 14px; min-width: 100px; }
  .stat-card .val { font-size: 1.3rem; font-weight: 600; color: #f8fafc; }
  .stat-card .lab { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 12px; }
  .chart-box { background: #1e293b; border-radius: 8px; padding: 12px; position: relative; }
  .chart-box canvas { width: 100% !important; height: 180px !important; }
  .chart-title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; }
  .iter-info { font-size: 0.8rem; color: #64748b; margin-top: 8px; }
</style>
</head>
<body>

<h1>3DGS-MCMC Live Viewer</h1>

<div class="status">
  <span><span class="dot off" id="statusDot"></span> <span id="statusText">disconnected</span></span>
  <span id="iterDisplay">iter: —</span>
  <span id="connDisplay">0 connected</span>
  <span style="margin-left:auto; display:flex; gap:6px; align-items:center; font-size:0.8rem;">
    <button id="camPrev" style="background:#334155; color:#e2e8f0; border:none; border-radius:4px; padding:2px 10px; cursor:pointer; font-size:0.9rem;">◀</button>
    <span id="camDisplay">cam 0/—</span>
    <button id="camNext" style="background:#334155; color:#e2e8f0; border:none; border-radius:4px; padding:2px 10px; cursor:pointer; font-size:0.9rem;">▶</button>
  </span>
</div>

<div class="top-row">
  <div class="canvas-wrap">
    <canvas id="renderCanvas"></canvas>
    <div class="canvas-label" id="imageInfo">waiting for render…</div>
  </div>
  <div class="stats">
    <div class="stat-card"><div class="val" id="statGaussians">—</div><div class="lab">Gaussians</div></div>
    <div class="stat-card"><div class="val" id="statLoss">—</div><div class="lab">Total Loss</div></div>
    <div class="stat-card"><div class="val" id="statL1">—</div><div class="lab">L1 Loss</div></div>
    <div class="stat-card"><div class="val" id="statIters">—</div><div class="lab">Iterations/s</div></div>
    <div class="stat-card"><div class="val" id="statTime">—</div><div class="lab">ms/iter</div></div>
    <div class="stat-card"><div class="val" id="statSH">—</div><div class="lab">SH Degree</div></div>
  </div>
</div>

<div class="charts">
  <div class="chart-box">
    <div class="chart-title">Loss</div>
    <canvas id="lossChart"></canvas>
  </div>
  <div class="chart-box">
    <div class="chart-title">Gaussian Count</div>
    <canvas id="countChart"></canvas>
  </div>
  <div class="chart-box">
    <div class="chart-title">Iterations / sec</div>
    <canvas id="itsChart"></canvas>
  </div>
</div>

<div class="iter-info" id="iterInfo">—</div>

<script>
// ---- WebSocket ----
const WS_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`;

// ---- Chart setup ----
const CHART_OPTS = {
  responsive: true, maintainAspectRatio: false,
  animation: { duration: 0 },
  scales: {
    x: { type: 'linear', title: { display: true, text: 'iteration', color: '#94a3b8' },
         ticks: { color: '#94a3b8', maxTicksLimit: 8 }, grid: { color: '#1e293b' } },
    y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
  },
  plugins: { legend: { labels: { color: '#e2e8f0', boxWidth: 12, padding: 8 } } }
};

function makeChart(ctx, label, color, yLabel) {
  return new Chart(ctx, {
    type: 'scatter',
    data: { datasets: [{ label, data: [], borderColor: color, backgroundColor: color,
                         pointRadius: 2, pointHoverRadius: 4, showLine: true }] },
    options: { ...CHART_OPTS,
      scales: { ...CHART_OPTS.scales, y: { ...CHART_OPTS.scales.y, title: { display: true, text: yLabel, color: '#94a3b8' } } }
    }
  });
}

const lossChart = makeChart(document.getElementById('lossChart'), 'Total Loss', '#f43f5e', 'loss');
const countChart = makeChart(document.getElementById('countChart'), 'Gaussians', '#38bdf8', 'count');
const itsChart = makeChart(document.getElementById('itsChart'), 'it/s', '#22c55e', 'it/s');

// ---- Stats updates ----
const MAX_POINTS = 2000;

let ws = null;
let reconnectTimer = null;
let camIdx = 0;       // current viewer camera (tracked for button clicks)
let totalCams = 1;    // total training cameras

function connect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    document.getElementById('statusDot').className = 'dot on';
    document.getElementById('statusText').textContent = 'connected';
    if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
    // Send ping immediately (and then every 15s) to keep connection alive
    ws.send('ping');
    reconnectTimer = setInterval(() => { try { ws.send('ping'); } catch(e) {} }, 5000);
  };

  ws.onclose = () => {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusText').textContent = 'disconnected — reconnecting…';
    if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
    setTimeout(connect, 2000);
  };

  ws.onerror = () => { ws.close(); };

  let pendingImage = null; // buffer for binary frame

  ws.onmessage = (event) => {
    if (event.data instanceof Blob) {
      // Binary frame — JPEG image bytes
      if (pendingImage) {
        const meta = pendingImage;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.getElementById('renderCanvas');
            canvas.width = meta.width;
            canvas.height = meta.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            document.getElementById('imageInfo').textContent =
              `iter ${meta.iteration} · ${meta.width}×${meta.height}`;
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(event.data);
        pendingImage = null;
      }
      return;
    }

    try {
      const msg = JSON.parse(event.data);

      if (msg.type === 'image') {
        pendingImage = msg; // next binary frame is the JPEG
        return;
      }

      if (msg.type === 'pong') return;

      if (msg.type === 'camera_info') {
        camIdx = msg.cam_idx;
        totalCams = msg.total_cams;
        document.getElementById('camDisplay').textContent = `cam ${camIdx}/${totalCams}`;
        return;
      }

      // Metrics JSON
      const it = msg.iteration;

      // Update stat cards
      document.getElementById('iterDisplay').textContent = `iter: ${it}`;
      if (msg.num_gaussians != null)
        document.getElementById('statGaussians').textContent =
          msg.num_gaussians >= 1000 ? (msg.num_gaussians/1000).toFixed(1) + 'k' : msg.num_gaussians;
      if (msg.loss != null) document.getElementById('statLoss').textContent = msg.loss.toFixed(5);
      if (msg.l1 != null) document.getElementById('statL1').textContent = msg.l1.toFixed(5);
      if (msg.it_s != null) document.getElementById('statIters').textContent = msg.it_s.toFixed(2);
      if (msg.iter_time_ms != null) document.getElementById('statTime').textContent = msg.iter_time_ms.toFixed(1);
      if (msg.sh_degree != null) document.getElementById('statSH').textContent = msg.sh_degree;
      if (msg.connections != null) document.getElementById('connDisplay').textContent = msg.connections + ' connected';

      // Update charts
      function addPoint(chart, x, y) {
        const ds = chart.data.datasets[0];
        ds.data.push({ x, y });
        if (ds.data.length > MAX_POINTS) ds.data.shift();
        chart.update('none');
      }

      if (msg.loss != null) addPoint(lossChart, it, msg.loss);
      if (msg.num_gaussians != null) addPoint(countChart, it, msg.num_gaussians);
      if (msg.it_s != null) addPoint(itsChart, it, msg.it_s);

      // Log line
      document.getElementById('iterInfo').textContent =
        `iter ${it}: loss=${msg.loss?.toFixed(5) ?? '—'}  N=${msg.num_gaussians?.toLocaleString() ?? '—'}  it/s=${msg.it_s?.toFixed(2) ?? '—'}`;

    } catch(e) {
      // ignore parse errors
    }
  };
}

connect();

// ---- Camera controls (button click handlers) ----
document.getElementById('camPrev').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    const newIdx = (camIdx - 1 + totalCams) % totalCams;
    ws.send(JSON.stringify({type: "set_camera", index: newIdx}));
  }
});
document.getElementById('camNext').addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    const newIdx = (camIdx + 1) % totalCams;
    ws.send(JSON.stringify({type: "set_camera", index: newIdx}));
  }
});</script>
</body>
</html>
